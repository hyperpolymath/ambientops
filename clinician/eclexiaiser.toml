# eclexiaiser manifest — energy/carbon resource budgets
# SPDX-License-Identifier: PMPL-1.0-or-later

[project]
name = "clinician"

[[functions]]
name = "analyze_envelope"
source = "src/tools/crisis.rs"
energy-budget-mj = 80.0
carbon-budget-mg = 16.0

[[functions]]
name = "find_related"
source = "src/storage/mod.rs"
energy-budget-mj = 30.0
carbon-budget-mg = 6.0

[carbon]
provider = "static"
region = "GB"
static-intensity = 200.0

[report]
format = "text"
include-recommendations = true

# SPDX-License-Identifier: MPL-2.0
[package]
name = "ambientops-clinician"
version = "1.2.0"
edition = "2021"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
description = "AmbientOps clinician - AI-assisted system administration with learning capabilities"
license = "MPL-2.0"
repository = "https://github.com/hyperpolymath/ambientops"
keywords = ["sysadmin", "ai", "linux", "automation", "monitoring"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }

# System introspection (Sysinternals-like)
sysinfo = "0.31"              # Process, CPU, memory, disk
procfs = "0.17"               # Linux /proc filesystem
nix = { version = "0.29", features = ["fs", "process", "net", "user"] }

# Serialization (always needed)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (AI module uses curl via tokio::process, reqwest for future)
reqwest = { version = "0.12.12", features = ["json", "multipart"] }

# Logging and errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"

# Config
config = "0.14"
directories = "5"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
ring = "0.17.13"
lru = "0.16.3"
uuid = { version = "1", features = ["v4"] }


toml = "0.8"

futures = "0.3"
walkdir = "2"
ambientops-contracts = { path = "../contracts-rust" }

# === Feature-gated dependencies (roadmap items, not yet used in code) ===
arangors = { version = "0.6", optional = true }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"], optional = true }
ollama-rs = { version = "0.3", optional = true }
ndarray = { version = "0.16", optional = true }
scraper = { version = "0.21", optional = true }
bluer = { version = "0.17", features = ["bluetoothd"], optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
filetime = "0.2"

[[bin]]
name = "ambientops-clinician"
path = "src/main.rs"

[features]
default = []
gpu = []          # GPU acceleration for local SLM
storage = ["arangors"]    # ArangoDB knowledge base
cache = ["redis"]         # Dragonfly/Redis caching
ai = ["ollama-rs"]        # Ollama SLM integration
p2p = []                  # Reserved for future P2P mesh communication
search = []               # Reserved for future local full-text index integration
forum = ["scraper"]       # Forum HTML scraping
anomaly = ["ndarray"]     # ESN/LSM anomaly detection
bluetooth = ["bluer"]     # Bluetooth device monitoring (BT Sentinel)
all = ["storage", "cache", "ai", "p2p", "search", "forum", "anomaly", "bluetooth"]

# NOTE: release-profile tuning lives in the workspace root Cargo.toml so it
# applies consistently across all member crates.

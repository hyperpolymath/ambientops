# eclexiaiser manifest — energy/carbon resource budgets
# SPDX-License-Identifier: PMPL-1.0-or-later

[project]
name = "nerdsafe-restart"

[[functions]]
name = "Auto_Detect_Resources"
source = "src/ada/nerdsafe_tui.adb"
energy-budget-mj = 20.0
carbon-budget-mg = 4.0

[[functions]]
name = "Build_Command"
source = "src/ada/nerdsafe_tui.adb"
energy-budget-mj = 10.0
carbon-budget-mg = 2.0

[carbon]
provider = "static"
region = "GB"
static-intensity = 200.0

[report]
format = "text"
include-recommendations = true

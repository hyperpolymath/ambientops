# ══════════════════════════════════════════════════════════════════
# Service: displace (Rust — verified file copy)
# Binary: displace
# Deps: none (zero dependencies)
# ══════════════════════════════════════════════════════════════════

[layers.displace-build]
description = "Build displace binary"
extends = "rust-toolchain"
commands = [
    "mkdir -p /build",
    "cp -r displace/ /build/displace/",
    "cd /build/displace && cargo build --release --locked",
]

[layers.displace-runtime]
description = "Displace distroless runtime"
extends = "wolfi-static"
copy-from = [
    { layer = "displace-build", src = "/build/displace/target/release/displace", dst = "/usr/local/bin/displace" },
]
entrypoint = ["/usr/local/bin/displace"]
user = "nonroot"
labels = { "org.opencontainers.image.title" = "Displace", "org.opencontainers.image.description" = "High-performance verified file and directory copying", "org.opencontainers.image.source" = "https://github.com/hyperpolymath/ambientops", "org.opencontainers.image.licenses" = "MPL-2.0" }

# ══════════════════════════════════════════════════════════════════
# Service: observatory (Elixir/OTP — metrics, weather, monitoring)
# App: system_observatory
# Deps: Elixir, Erlang/OTP
# ══════════════════════════════════════════════════════════════════

[layers.observatory-build]
description = "Build observatory Elixir release"
extends = "elixir-toolchain"
commands = [
    "mkdir -p /build",
    "cp -r observatory/ /build/observatory/",
    "cd /build/observatory && mix local.hex --force && mix local.rebar --force",
    "cd /build/observatory && MIX_ENV=prod mix deps.get --only prod",
    "cd /build/observatory && MIX_ENV=prod mix deps.compile",
    "cd /build/observatory && MIX_ENV=prod mix compile",
    "cd /build/observatory && MIX_ENV=prod mix release",
]

[layers.observatory-runtime]
description = "Observatory minimal runtime"
extends = "wolfi-base"
packages = ["libstdc++", "openssl", "ncurses-libs", "ca-certificates"]
copy-from = [
    { layer = "observatory-build", src = "/build/observatory/_build/prod/rel/system_observatory/", dst = "/app/" },
]
entrypoint = ["/app/bin/system_observatory"]
cmd = ["start"]
user = "observatory"
healthcheck = { cmd = ["/app/bin/system_observatory", "pid"], interval = "30s", timeout = "10s", start-period = "10s", retries = 3 }
labels = { "org.opencontainers.image.title" = "System Observatory", "org.opencontainers.image.description" = "Metrics, system weather, and monitoring hub", "org.opencontainers.image.source" = "https://github.com/hyperpolymath/ambientops", "org.opencontainers.image.licenses" = "MPL-2.0" }

# ══════════════════════════════════════════════════════════════════
# Service: hybrid-automation-router (Elixir — IaC routing engine)
# App: har
# Deps: Elixir, Erlang/OTP, Phoenix (future)
# Ports: 4050 (web), 4369 (EPMD), 9100-9155 (distributed Erlang)
# ══════════════════════════════════════════════════════════════════

[layers.har-build]
description = "Build HAR Elixir release"
extends = "elixir-toolchain"
commands = [
    "mkdir -p /build",
    "cp -r hybrid-automation-router/ /build/har/",
    "cd /build/har && mix local.hex --force && mix local.rebar --force",
    "cd /build/har && MIX_ENV=prod mix deps.get --only prod",
    "cd /build/har && MIX_ENV=prod mix deps.compile",
    "cd /build/har && MIX_ENV=prod mix compile",
    "cd /build/har && MIX_ENV=prod mix release",
]

[layers.har-runtime]
description = "HAR minimal runtime"
extends = "wolfi-base"
packages = ["libstdc++", "openssl", "ncurses-libs", "ca-certificates", "curl"]
copy-from = [
    { layer = "har-build", src = "/build/har/_build/prod/rel/har/", dst = "/app/" },
]
entrypoint = ["/app/bin/har"]
cmd = ["start"]
user = "har"
expose = [4050, 4369]
healthcheck = { cmd = ["curl", "-sf", "http://localhost:4050/health"], interval = "30s", timeout = "10s", start-period = "5s", retries = 3 }
env = { RELEASE_COOKIE = "har_cluster_cookie", RELEASE_NODE = "har@127.0.0.1", PHX_HOST = "localhost", PHX_SERVER = "true", PORT = "4050" }
labels = { "org.opencontainers.image.title" = "Hybrid Automation Router", "org.opencontainers.image.description" = "BGP-like routing engine for infrastructure-as-code", "org.opencontainers.image.source" = "https://github.com/hyperpolymath/ambientops", "org.opencontainers.image.licenses" = "MPL-2.0" }

# ══════════════════════════════════════════════════════════════════
# Service: operating-theatre (D-lang — system recovery)
# Binary: sor
# Deps: LDC runtime
# ══════════════════════════════════════════════════════════════════

[layers.sor-build]
description = "Build operating-theatre (System Operating Room) D-lang binary"
extends = "d-toolchain"
commands = [
    "mkdir -p /build",
    "cp -r system-tools/recovery/operating-theatre/ /build/sor/",
    "cd /build/sor && dub build --build=release",
]

[layers.sor-runtime]
description = "Operating Theatre minimal runtime"
extends = "wolfi-base"
packages = ["ldc-runtime"]
copy-from = [
    { layer = "sor-build", src = "/build/sor/sor", dst = "/app/sor" },
]
entrypoint = ["/app/sor"]
cmd = ["help"]
user = "nonroot"
labels = { "org.opencontainers.image.title" = "Operating Theatre", "org.opencontainers.image.description" = "System recovery tool — D-lang operating room", "org.opencontainers.image.source" = "https://github.com/hyperpolymath/ambientops", "org.opencontainers.image.licenses" = "MPL-2.0" }

# ══════════════════════════════════════════════════════════════════
# Service: systems-observatory (Julia — GDPR-compliant auditing)
# App: Juisys
# Deps: Julia packages (JSON3, XLSX, DataFrames)
# ══════════════════════════════════════════════════════════════════

[layers.juisys-build]
description = "Build Juisys Julia audit tool"
extends = "julia-runtime"
commands = [
    "mkdir -p /app",
    "cp -r system-tools/monitoring/systems-observatory/ /app/juisys/",
    "cd /app/juisys && julia --project=. -e 'using Pkg; Pkg.instantiate()'",
    "cd /app/juisys && julia --project=. -e 'include(\"src/security.jl\"); using .Security; checks = Security.self_audit(); all_passed = all(c -> c.passed, checks); if !all_passed exit(1) end'",
]

[layers.juisys-runtime]
description = "Juisys Julia runtime — privacy-first auditing"
extends = "julia-runtime"
copy-from = [
    { layer = "juisys-build", src = "/app/juisys/", dst = "/app/" },
]
entrypoint = ["julia", "--project=/app", "-e", "include(\"/app/src/cli.jl\"); using .CLI; CLI.run()"]
user = "nonroot"
labels = { "org.opencontainers.image.title" = "Juisys (Systems Observatory)", "org.opencontainers.image.description" = "Privacy-first GDPR-compliant application auditing tool", "org.opencontainers.image.source" = "https://github.com/hyperpolymath/ambientops", "org.opencontainers.image.licenses" = "MPL-2.0" }

# ══════════════════════════════════════════════════════════════════
# Service: nerdsafe-restart (Bash — pre-reboot validation)
# Binary: nerdsafe-restart.sh (shell script)
# Deps: coreutils, findutils, gawk, grep, procps-ng, ShellCheck
# ══════════════════════════════════════════════════════════════════

[layers.nerdsafe-runtime]
description = "Nerdsafe-restart validation tools"
extends = "wolfi-base"
packages = ["bash", "coreutils", "findutils", "gawk", "grep", "procps", "shellcheck"]
commands = [
    "mkdir -p /app",
    "cp nerdsafe-restart/nerdsafe-restart.sh /usr/local/bin/nerdsafe-restart",
    "chmod +x /usr/local/bin/nerdsafe-restart",
]
entrypoint = ["/usr/local/bin/nerdsafe-restart"]
cmd = ["check"]
user = "nonroot"
labels = { "org.opencontainers.image.title" = "Nerdsafe Restart", "org.opencontainers.image.description" = "Pre-reboot validation for paranoid sysadmins", "org.opencontainers.image.source" = "https://github.com/hyperpolymath/ambientops", "org.opencontainers.image.licenses" = "MPL-2.0" }

# ══════════════════════════════════════════════════════════════════
# Service: session-sentinel (container orchestration)

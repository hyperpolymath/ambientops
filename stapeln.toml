# SPDX-License-Identifier: MPL-2.0
# stapeln.toml — Layer-based container build for ambientops
#
# stapeln builds containers as composable layers (German: "to stack").
# Each layer is independently cacheable, verifiable, and signable.
#
# AmbientOps is a hospital-model operations framework (hybrid monorepo).
# Components span Rust workspace crates, Elixir services, shell tools,
# D-lang recovery, Julia auditing, and an Elixir automation router.
#
# This file defines every containerised component as a Stapeln service
# with shared base layers, per-service build/runtime layers, and
# unified security + verification policy.

[metadata]
name = "ambientops"
version = "1.2.0"
description = "Hospital-model ambient operations framework — container stack"
author = "Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"
license = "MPL-2.0"
registry = "ghcr.io/hyperpolymath"

[build]
containerfile = "Containerfile"
context = "."
runtime = "podman"

# ══════════════════════════════════════════════════════════════════
# Shared Base Layers
# ══════════════════════════════════════════════════════════════════

[layers.wolfi-base]
description = "Chainguard Wolfi minimal base — shared by all services"
from = "cgr.dev/chainguard/wolfi-base:latest"
cache = true
verify = true

[layers.wolfi-static]
description = "Chainguard static base — distroless for Go-free Rust binaries"
from = "cgr.dev/chainguard/static:latest"
cache = true
verify = true

[layers.rust-toolchain]
description = "Rust build toolchain on Wolfi"
extends = "wolfi-base"
packages = ["rust", "cargo", "build-base", "openssl-dev", "pkgconf"]
cache = true

[layers.elixir-toolchain]
description = "Elixir/OTP build toolchain on Wolfi"
extends = "wolfi-base"
packages = ["elixir", "erlang", "git", "build-base"]
cache = true

[layers.d-toolchain]
description = "D (LDC) build toolchain on Wolfi"
extends = "wolfi-base"
packages = ["ldc", "dub", "gcc", "glibc-dev"]
cache = true

[layers.julia-runtime]
description = "Julia runtime for batch/audit tools"
from = "docker.io/library/julia:1.11-bookworm"
cache = true
verify = true

# ══════════════════════════════════════════════════════════════════
# Service: clinician (Rust — AI-assisted sysadmin CLI)
# Binary: ambientops-clinician
# Deps: ambientops-contracts (workspace), /proc + /sys read access
# ══════════════════════════════════════════════════════════════════

[layers.clinician-build]
description = "Build clinician from Rust workspace root"
extends = "rust-toolchain"
commands = [
    "mkdir -p /build",
    "cp -r . /build/",
    "cd /build && cargo build --release -p ambientops-clinician --locked",
]

[layers.clinician-runtime]
description = "Clinician minimal runtime"
extends = "wolfi-base"
packages = ["libgcc", "ca-certificates"]
copy-from = [
    { layer = "clinician-build", src = "/build/target/release/ambientops-clinician", dst = "/usr/local/bin/psa" },
]
entrypoint = ["/usr/local/bin/psa"]
cmd = ["daemon"]
user = "psa"
healthcheck = { cmd = ["/usr/local/bin/psa", "health"], interval = "30s", timeout = "5s", start-period = "5s", retries = 3 }
env = { PSA_DATA_DIR = "/home/psa/.local/share/psa", PSA_CACHE_DIR = "/home/psa/.cache/psa", PSA_CONFIG_DIR = "/home/psa/.config/psa", RUST_LOG = "info" }
labels = { "org.opencontainers.image.title" = "AmbientOps Clinician", "org.opencontainers.image.description" = "AI-assisted Linux system administration toolkit", "org.opencontainers.image.source" = "https://github.com/hyperpolymath/ambientops", "org.opencontainers.image.licenses" = "MPL-2.0", "org.opencontainers.image.vendor" = "hyperpolymath" }

# ══════════════════════════════════════════════════════════════════
# Service: hardware-crash-team (Rust — hardware diagnostics)
# Binary: hardware-crash-team
# Deps: ambientops-contracts (workspace), /proc + /sys read access
# ══════════════════════════════════════════════════════════════════

[layers.hct-build]

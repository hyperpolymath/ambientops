packages = ["fuse3-dev"]
commands = [
    "mkdir -p /build",
    "cp -r czech-file-knife/ /build/cfk/",
    "cd /build/cfk && cargo build --release -p cfk-cli --locked",
]

[layers.cfk-runtime]
description = "Czech File Knife minimal runtime"
extends = "wolfi-base"
packages = ["fuse3", "fuse3-libs", "ca-certificates"]
copy-from = [
    { layer = "cfk-build", src = "/build/cfk/target/release/cfk", dst = "/usr/local/bin/cfk" },
]
entrypoint = ["/usr/local/bin/cfk"]
user = "cfk"
labels = { "org.opencontainers.image.title" = "Czech File Knife", "org.opencontainers.image.description" = "Universal file management tool with cloud providers, VFS, and search", "org.opencontainers.image.source" = "https://github.com/hyperpolymath/czech-file-knife", "org.opencontainers.image.licenses" = "MPL-2.0" }

# ══════════════════════════════════════════════════════════════════
# Service: panoptes (Rust — AI file scanner/renamer)
# Binary: panoptes
# Deps: Nickel config, /watch volume
# ══════════════════════════════════════════════════════════════════

[layers.panoptes-build]
description = "Build panoptes binary"
extends = "rust-toolchain"
commands = [
    "mkdir -p /build",
    "cp -r panoptes/ /build/panoptes/",
    "cd /build/panoptes && cargo build --release --locked",
]

[layers.panoptes-runtime]
description = "Panoptes minimal runtime"
extends = "wolfi-base"
packages = ["openssl", "ca-certificates"]
copy-from = [
    { layer = "panoptes-build", src = "/build/panoptes/target/release/panoptes", dst = "/usr/local/bin/panoptes" },
]

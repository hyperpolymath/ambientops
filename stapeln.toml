copy-from = [
    { layer = "hct-build", src = "/build/target/release/hardware-crash-team", dst = "/usr/local/bin/hardware-crash-team" },
]
entrypoint = ["/usr/local/bin/hardware-crash-team"]
cmd = ["scan"]
user = "nonroot"
labels = { "org.opencontainers.image.title" = "Hardware Crash Team", "org.opencontainers.image.description" = "Hardware diagnostic and remediation for zombie devices, driver conflicts, PCI bus issues", "org.opencontainers.image.source" = "https://github.com/hyperpolymath/ambientops", "org.opencontainers.image.licenses" = "MPL-2.0" }

# ══════════════════════════════════════════════════════════════════
# Service: czech-file-knife (Rust workspace — universal file tool)
# Binary: cfk
# Deps: own workspace (cfk-core, cfk-providers, cfk-cli, etc.)
# ══════════════════════════════════════════════════════════════════

[layers.cfk-build]
description = "Build czech-file-knife cfk-cli binary"

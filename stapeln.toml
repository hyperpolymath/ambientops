# ══════════════════════════════════════════════════════════════════
# Service: svalinn (Rust+Ada — secure identity vault)
# Binaries: svalinn-vault (Rust), svalinn-cli (Ada)
# Ports: 8443 (TLS, IPv6 only)
# Deps: WireGuard, firewalld, SELinux
# ══════════════════════════════════════════════════════════════════

[layers.svalinn-build]
description = "Build Svalinn vault core (Rust)"
extends = "rust-toolchain"
commands = [
    "mkdir -p /build",
    "cp -r reasonably-good-token-vault/ /build/rgtv/",
    "cd /build/rgtv/vault-core && RUSTFLAGS='-C target-feature=+cet' cargo build --release --locked",
]

[layers.svalinn-runtime]
description = "Svalinn secure vault runtime"
extends = "wolfi-base"
packages = ["wireguard-tools", "ca-certificates", "openssl"]
copy-from = [
    { layer = "svalinn-build", src = "/build/rgtv/vault-core/target/release/svalinn-vault", dst = "/usr/local/bin/svalinn-vault" },
]
entrypoint = ["/usr/local/bin/svalinn-vault"]
cmd = ["serve", "--config", "/vault/config/vault.toml"]
user = "svalinn"
expose = [8443]
volumes = ["/vault/data", "/vault/config", "/vault/keys"]
healthcheck = { cmd = ["/usr/local/bin/svalinn-vault", "health"], interval = "30s", timeout = "10s", start-period = "5s", retries = 3 }
labels = { "org.opencontainers.image.title" = "Svalinn Vault", "org.opencontainers.image.description" = "Secure identity vault with post-quantum signing", "org.opencontainers.image.source" = "https://github.com/hyperpolymath/ambientops", "org.opencontainers.image.licenses" = "MPL-2.0" }

# ══════════════════════════════════════════════════════════════════
# Service: immutable-linux-auditor (C++ via CMake — audit tool)
# Binary: immutable-linux-auditor
# ══════════════════════════════════════════════════════════════════

[layers.ila-build]
description = "Build immutable-linux-auditor"
extends = "wolfi-base"
packages = ["cmake", "ninja", "pkgconf", "gcc", "g++", "build-base"]
commands = [
    "mkdir -p /build",
    "cp -r immutable-linux-auditor/ /build/ila/",
    "cd /build/ila && cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release",
    "cd /build/ila && cmake --build build",
]

[layers.ila-runtime]
description = "Immutable Linux Auditor runtime"
extends = "wolfi-base"
packages = ["libgcc", "libstdc++"]
copy-from = [
    { layer = "ila-build", src = "/build/ila/build/immutable-linux-auditor", dst = "/usr/local/bin/immutable-linux-auditor" },
]
entrypoint = ["/usr/local/bin/immutable-linux-auditor"]
user = "nonroot"
labels = { "org.opencontainers.image.title" = "Immutable Linux Auditor", "org.opencontainers.image.description" = "Audit tool for immutable Linux distributions", "org.opencontainers.image.source" = "https://github.com/hyperpolymath/ambientops", "org.opencontainers.image.licenses" = "MPL-2.0" }

# ══════════════════════════════════════════════════════════════════
# Security (applies to ALL services)
# ══════════════════════════════════════════════════════════════════

[security]
non-root = true
read-only-root = true
no-new-privileges = true
cap-drop = ["ALL"]
seccomp-profile = "default"

[security.signing]
algorithm = "ML-DSA-87"
provider = "cerro-torre"

[security.sbom]
format = "spdx-json"
output = "sbom.spdx.json"
include-deps = true

# ══════════════════════════════════════════════════════════════════
# Verification (vordr + svalinn)
# ══════════════════════════════════════════════════════════════════

[verify]
vordr = true
svalinn = true
scan-on-build = true
fail-on = ["critical", "high"]

# ══════════════════════════════════════════════════════════════════
# Targets — composable service sets
# ══════════════════════════════════════════════════════════════════

[targets.development]
description = "All services with debug logging"
layers = [
    "clinician-build",
    "hct-build",
    "cfk-build",
    "panoptes-build",
    "displace-build",
    "observatory-build",
    "har-build",
    "sor-build",
    "nerdsafe-runtime",
]
env = { LOG_LEVEL = "debug", RUST_LOG = "debug" }

[targets.production]
description = "All runtime-optimised service layers"
layers = [
    "clinician-runtime",
    "hct-runtime",
    "cfk-runtime",
    "panoptes-runtime",
    "displace-runtime",
    "observatory-runtime",
    "har-runtime",
    "sor-runtime",
    "nerdsafe-runtime",
    "svalinn-runtime",
    "ila-runtime",
]
env = { LOG_LEVEL = "info", RUST_LOG = "info" }

[targets.test]
description = "Build layers for CI/CD test matrix"
layers = [
    "clinician-build",
    "hct-build",
    "cfk-build",
    "panoptes-build",
    "displace-build",
    "observatory-build",
    "har-build",
    "sor-build",
]
env = { LOG_LEVEL = "debug", RUST_LOG = "debug,test=trace" }

[targets.core-ops]
description = "Core operations: clinician + hardware-crash-team + observatory"
layers = [
    "clinician-runtime",
    "hct-runtime",
    "observatory-runtime",
]
env = { LOG_LEVEL = "info", RUST_LOG = "info" }

[targets.file-tools]
description = "File management: czech-file-knife + panoptes + displace"
layers = [
    "cfk-runtime",
    "panoptes-runtime",
    "displace-runtime",
]
env = { LOG_LEVEL = "info" }

[targets.security-vault]
description = "Security infrastructure: svalinn vault"
layers = [
    "svalinn-runtime",
]
env = { LOG_LEVEL = "info" }

[targets.recovery]
description = "Recovery and validation tools"
layers = [
    "sor-runtime",
    "nerdsafe-runtime",
    "ila-runtime",
]
env = { LOG_LEVEL = "info" }

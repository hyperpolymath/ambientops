[package]
name = "network-ambulance"
version = "1.1.0"
description = "Network diagnostics and repair tool — Gossamer webview shell"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
edition = "2021"
rust-version = "1.70"

[[bin]]
name = "network-ambulance"
path = "src/main.rs"

[dependencies]
gossamer-rs = { path = "../../../../../gossamer/bindings/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true

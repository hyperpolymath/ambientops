# eclexiaiser manifest — energy/carbon resource budgets
# SPDX-License-Identifier: MPL-2.0

[project]
name = "panoptes"

[[functions]]
name = "process_file"
source = "src/main.rs"
energy-budget-mj = 45.0
carbon-budget-mg = 9.0

[[functions]]
name = "run_analyze"
source = "src/main.rs"
energy-budget-mj = 60.0
carbon-budget-mg = 12.0

[carbon]
provider = "static"
region = "GB"
static-intensity = 200.0

[report]
format = "text"
include-recommendations = true

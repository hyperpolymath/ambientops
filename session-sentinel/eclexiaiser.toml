# eclexiaiser manifest — energy/carbon resource budgets
# SPDX-License-Identifier: MPL-2.0

[project]
name = "session-sentinel"

[[functions]]
name = "scan_conversation"
source = "src/core/scanner.eph"
energy-budget-mj = 30.0
carbon-budget-mg = 6.0

[[functions]]
name = "aggregate_bytes"
source = "src/core/scanner.eph"
energy-budget-mj = 15.0
carbon-budget-mg = 3.0

[carbon]
provider = "static"
region = "GB"
static-intensity = 200.0

[report]
format = "text"
include-recommendations = true

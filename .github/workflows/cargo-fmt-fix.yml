# SPDX-License-Identifier: MPL-2.0
# One-shot workflow: runs cargo fmt --all and opens a PR with the result.
# Trigger manually via workflow_dispatch, then delete after the PR merges.

name: Fix Rust Formatting (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fmt-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b7dd654863b19a16e6171e2355d23a49e0e312 # stable
        with:
          components: rustfmt

      - name: Run cargo fmt --all
        run: cargo fmt --all

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No formatting changes needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Formatting changes detected:"
            git diff --stat
          fi

      - name: Create PR with formatting fix
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5e914681df9dc83aa4e4905f02abb50a59244afe # v10.0.0
        with:
          commit-message: "style: cargo fmt --all"
          title: "style: cargo fmt --all"
          body: |
            Auto-generated by the one-shot `cargo-fmt-fix.yml` workflow.

            This PR reformats all Rust workspace members to match `rustfmt` defaults.

            After merging, delete this workflow (it has served its purpose).
          branch: fix/cargo-fmt-auto
          delete-branch: true
          labels: chore, cicd
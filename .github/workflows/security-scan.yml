name: Security Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    uses: hyperpolymath/panic-attacker/.github/workflows/scan-and-report.yml@edbfcffec120a63fbf4cc393f1439d32589248d7

    secrets:
      VERISIMDB_PAT: ${{ secrets.VERISIMDB_PAT }}

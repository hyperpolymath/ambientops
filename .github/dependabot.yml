# SPDX-License-Identifier: MPL-2.0
# Dependabot configuration for RSR-compliant repositories
# Covers common ecosystems - remove unused ones for your project

version: 2
updates:
  # GitHub Actions - always include
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2

  # Rust/Cargo - group the same dependency across the workspace crates
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/czech-file-knife"
      - "/panoptes"
      - "/personal-sysadmin"
      - "/displace"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 3
    groups:
      shared-rust-dependencies:
        group-by: dependency-name
    ignore:
      # Estate policy standards#301 / docs/DEPENDABOT-POLICY.adoc:
      # ignore semver-major bumps so they land via author-supplied PRs
      # paired with call-site updates. Minor + patch flow normally.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # Elixir/Mix
  - package-ecosystem: "mix"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Node.js/npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Python/pip
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Guix flakes
  - package-ecosystem: "guix"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 2
    ignore:
      # Estate policy standards#301 / docs/DEPENDABOT-POLICY.adoc:
      # ignore semver-major bumps so they land via author-supplied PRs
      # paired with call-site updates. Minor + patch flow normally.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

# SPDX-License-Identifier: MPL-2.0
# Dependabot configuration for RSR-compliant repositories
# Covers common ecosystems - remove unused ones for your project

version: 2
updates:
  # GitHub Actions - always include
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions:
        patterns:
          - "*"

  # Rust/Cargo - root workspace
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"

  # Rust/Cargo - standalone crates
  - package-ecosystem: "cargo"
    directory: "/czech-file-knife"
    schedule:
      interval: "daily"

  - package-ecosystem: "cargo"
    directory: "/panoptes"
    schedule:
      interval: "daily"

  - package-ecosystem: "cargo"
    directory: "/personal-sysadmin"
    schedule:
      interval: "daily"

  - package-ecosystem: "cargo"
    directory: "/displace"
    schedule:
      interval: "daily"

  # Elixir/Mix
  - package-ecosystem: "mix"
    directory: "/"
    schedule:
      interval: "daily"

  # Node.js/npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"

  # Python/pip
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"

  # Nix flakes
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "daily"
